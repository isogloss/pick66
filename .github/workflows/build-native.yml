name: Build Native DLL

on:
  push:
    branches: [ main ]
    paths:
      - 'src/Pick6.Native/**'
      - '.github/workflows/build-native.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/Pick6.Native/**'
      - '.github/workflows/build-native.yml'
  workflow_dispatch:

jobs:
  build-native-dll:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup CMake
      uses: lukka/get-cmake@latest
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
    
    - name: Configure CMake (Release)
      run: |
        cd src/Pick6.Native
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64
      
    - name: Build Release
      run: |
        cd src/Pick6.Native/build
        cmake --build . --config Release
    
    - name: Build Debug
      run: |
        cd src/Pick6.Native/build
        cmake --build . --config Debug
      continue-on-error: true
    
    - name: List Build Output Files
      run: |
        Write-Host "========================================" -ForegroundColor Cyan
        Write-Host "Listing build directory contents..." -ForegroundColor Cyan
        Write-Host "========================================" -ForegroundColor Cyan
        Write-Host ""
        Write-Host "Build directory structure:" -ForegroundColor Yellow
        Get-ChildItem -Path "src/Pick6.Native/build" -Recurse | Select-Object FullName, Length, LastWriteTime | Format-Table -AutoSize
        Write-Host ""
        Write-Host "Release directory contents:" -ForegroundColor Yellow
        if (Test-Path "src/Pick6.Native/build/Release") {
          Get-ChildItem -Path "src/Pick6.Native/build/Release" -File | ForEach-Object {
            Write-Host "  $($_.Name) - $($_.Length) bytes"
          }
        } else {
          Write-Host "  ❌ Release directory does not exist!" -ForegroundColor Red
        }
        Write-Host ""
        Write-Host "Debug directory contents:" -ForegroundColor Yellow
        if (Test-Path "src/Pick6.Native/build/Debug") {
          Get-ChildItem -Path "src/Pick6.Native/build/Debug" -File | ForEach-Object {
            Write-Host "  $($_.Name) - $($_.Length) bytes"
          }
        } else {
          Write-Host "  ℹ Debug directory does not exist (this is OK if debug build failed)" -ForegroundColor Gray
        }
        Write-Host ""
        Write-Host "Checking for Pick6Test.exe:" -ForegroundColor Yellow
        if (Test-Path "src/Pick6.Native/build/Release/Pick6Test.exe") {
          Write-Host "  ✅ Found at src/Pick6.Native/build/Release/Pick6Test.exe" -ForegroundColor Green
        } else {
          Write-Host "  ❌ NOT found at src/Pick6.Native/build/Release/Pick6Test.exe" -ForegroundColor Red
          Write-Host "  Searching for Pick6Test.exe in build directory..." -ForegroundColor Yellow
          Get-ChildItem -Path "src/Pick6.Native/build" -Recurse -Filter "Pick6Test.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "  Found at: $($_.FullName)" -ForegroundColor Cyan
          }
        }
      shell: pwsh
    
    - name: Run Tests
      run: |
        $testExePath = "src/Pick6.Native/build/Release/Pick6Test.exe"
        if (Test-Path $testExePath) {
          Write-Host "Running Pick6Test.exe..." -ForegroundColor Green
          cd src/Pick6.Native/build/Release
          ./Pick6Test.exe
        } else {
          Write-Host "❌ ERROR: Pick6Test.exe not found at $testExePath" -ForegroundColor Red
          Write-Host "Searching for alternative locations..." -ForegroundColor Yellow
          $found = Get-ChildItem -Path "src/Pick6.Native/build" -Recurse -Filter "Pick6Test.exe" -ErrorAction SilentlyContinue
          if ($found) {
            Write-Host "Found Pick6Test.exe at: $($found.FullName)" -ForegroundColor Cyan
            Write-Host "Attempting to run from found location..." -ForegroundColor Yellow
            & $found.FullName
          } else {
            Write-Host "❌ Pick6Test.exe not found anywhere in build directory" -ForegroundColor Red
            exit 1
          }
        }
      shell: pwsh
      continue-on-error: true
    
    - name: Upload Release Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Pick6Native-Release
        path: |
          src/Pick6.Native/build/Release/Pick6Native.dll
          src/Pick6.Native/build/Release/Pick6Native.lib
          src/Pick6.Native/build/Release/Pick6Test.exe
    
    - name: Upload Debug Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Pick6Native-Debug
        path: |
          src/Pick6.Native/build/Debug/Pick6Native.dll
          src/Pick6.Native/build/Debug/Pick6Native.lib
          src/Pick6.Native/build/Debug/Pick6Native.pdb
          src/Pick6.Native/build/Debug/Pick6Test.exe
      continue-on-error: true
    
    - name: Verify DLL
      run: |
        Write-Host "Verifying Pick6Native.dll..."
        $dllPath = "src/Pick6.Native/build/Release/Pick6Native.dll"
        if (Test-Path $dllPath) {
          $dll = Get-Item $dllPath
          Write-Host "✅ DLL built successfully"
          Write-Host "   Path: $dllPath"
          Write-Host "   Size: $($dll.Length) bytes"
          Write-Host "   Modified: $($dll.LastWriteTime)"
        } else {
          Write-Host "❌ DLL not found at $dllPath"
          exit 1
        }
      shell: pwsh
