name: Build and Release Pick6

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: |
        Write-Host "Restoring NuGet packages..." -ForegroundColor Cyan
        dotnet restore src/Pick6.Loader/Pick6.Loader.csproj
        if ($LASTEXITCODE -ne 0) { 
          Write-Host "❌ Failed to restore dependencies" -ForegroundColor Red
          exit 1 
        }
        Write-Host "✅ Dependencies restored successfully" -ForegroundColor Green
      shell: pwsh
      
    - name: Build and publish as single-file executable
      run: |
        Write-Host "Building Pick6 Loader as single-file executable..." -ForegroundColor Cyan
        Write-Host "This creates a fully self-contained .exe with all dependencies embedded" -ForegroundColor Yellow
        
        dotnet publish src/Pick6.Loader/Pick6.Loader.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          --output dist `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:IncludeAllContentForSelfExtract=true `
          -p:PublishReadyToRun=true `
          -p:EnableCompressionInSingleFile=true `
          -p:DebugType=none `
          -p:DebugSymbols=false
        
        if ($LASTEXITCODE -ne 0) { 
          Write-Host "❌ Build failed" -ForegroundColor Red
          exit 1 
        }
        
        Write-Host "✅ Build completed successfully" -ForegroundColor Green
        Write-Host "Output location: dist/loader.exe" -ForegroundColor Cyan
        
        # Verify the executable was created
        if (Test-Path "dist/loader.exe") {
          $fileSize = (Get-Item "dist/loader.exe").Length / 1MB
          Write-Host "✅ Executable created: loader.exe ($([math]::Round($fileSize, 2)) MB)" -ForegroundColor Green
        } else {
          Write-Host "❌ Executable not found!" -ForegroundColor Red
          exit 1
        }
      shell: pwsh

    - name: Get version from tag or input
      id: version
      run: |
        Write-Host "Determining version..." -ForegroundColor Cyan
        if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_type }}" -eq "tag") {
          $version = "${{ github.ref_name }}" -replace "^v", ""
          Write-Host "Using tag version: $version" -ForegroundColor Green
        } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $version = "${{ github.event.inputs.version }}"
          Write-Host "Using manual version: $version" -ForegroundColor Green
        } else {
          $version = "dev-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
          Write-Host "Using development version: $version" -ForegroundColor Yellow
        }
        echo "version=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh
        
    - name: Rename and prepare executable
      run: |
        Write-Host "Preparing release executable..." -ForegroundColor Cyan
        $version = "${{ steps.version.outputs.version }}"
        $source = "dist/loader.exe"
        $dest = "dist/Pick6-v$version.exe"
        
        if (Test-Path $source) {
          Copy-Item $source $dest
          Write-Host "✅ Created: Pick6-v$version.exe" -ForegroundColor Green
          
          # Display file information
          $fileInfo = Get-Item $dest
          $fileSizeMB = [math]::Round($fileInfo.Length / 1MB, 2)
          Write-Host "   Size: $fileSizeMB MB" -ForegroundColor Cyan
          Write-Host "   Path: $dest" -ForegroundColor Cyan
        } else {
          Write-Host "❌ Source file not found: $source" -ForegroundColor Red
          exit 1
        }
      shell: pwsh

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: Pick6-v${{ steps.version.outputs.version }}
        path: |
          dist/Pick6-v${{ steps.version.outputs.version }}.exe
          dist/loader.exe
        retention-days: 90
          
    - name: Create GitHub Release
      if: github.event_name == 'push' && github.ref_type == 'tag'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/Pick6-v${{ steps.version.outputs.version }}.exe
        body: |
          ## Pick6 v${{ steps.version.outputs.version }}
          
          ### 📦 Single-File Executable
          
          **Download: `Pick6-v${{ steps.version.outputs.version }}.exe`**
          
          This is a fully self-contained Windows executable with all dependencies embedded:
          - ✅ No installation required - just download and run
          - ✅ No .NET runtime installation needed - runtime is embedded
          - ✅ All dependencies included in single .exe file
          - ✅ Built with Costura.Fody for maximum compatibility
          
          ### 🚀 Usage
          
          1. **Download** the .exe file from the assets below
          2. **Run** the executable directly on Windows 10/11 x64
          3. **Administrator privileges** are recommended for game injection features
          
          ### 📋 Features
          
          - Game capture and projection for FiveM
          - Multi-strategy injection (direct + proxy DLL fallbacks)
          - Support for DXGI, D3D11, and Vulkan graphics APIs
          - Real-time borderless projection
          - Automatic privilege elevation
          - GUI interface with system tray support
          
          ### ⚙️ Command Line Options
          
          ```
          Pick6.exe                    # Start with GUI interface
          Pick6.exe --help            # Show help information
          Pick6.exe --check-updates   # Check for updates at startup
          ```
          
          ### 📝 System Requirements
          
          - Windows 10/11 (64-bit)
          - No additional dependencies required
          - Administrator privileges recommended for injection features
          
          ### 🐛 Issues & Feedback
          
          Please report any issues on the [GitHub Issues](https://github.com/isogloss/pick66/issues) page.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}